# Builds a signed release APK for every vX.Y.Z tag pushed to GitHub and attaches it to a GitHub
# Release. The version name and code come from the tag (see appVersion() in app/build.gradle.kts).
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RECIPECRAFT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The RECIPECRAFT_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test, lint and build the signed release APK
        env:
          RECIPECRAFT_VERSION: ${{ github.ref_name }}
          RECIPECRAFT_KEYSTORE: ${{ runner.temp }}/release.jks
          RECIPECRAFT_KEYSTORE_PASSWORD: ${{ secrets.RECIPECRAFT_KEYSTORE_PASSWORD }}
          RECIPECRAFT_KEY_ALIAS: ${{ secrets.RECIPECRAFT_KEY_ALIAS }}
          RECIPECRAFT_KEY_PASSWORD: ${{ secrets.RECIPECRAFT_KEY_PASSWORD }}
        run: ./gradlew test lint koverVerify assembleRelease

      # The ABI splits produce app-<abi>-release.apk only when the build was signed; an unsigned
      # build is named app-<abi>-release-unsigned.apk, so cp also fails when signing was skipped.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/RecipeCraft-$TAG-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          gh release create "$TAG" dist/* --title "RecipeCraft $TAG" --generate-notes --notes "$(cat <<'EOF'
          **Which APK?** Most phones and tablets: `arm64-v8a`. Older 32-bit phones: `armeabi-v7a`. Emulators and x86 Chromebooks: `x86_64` (or `x86`). Not sure: `universal` runs on all of them. `SHA256SUMS.txt` lists each file's checksum.
          EOF
          )"
