# Builds a signed release APK for every vX.Y.Z tag pushed to GitHub and attaches it to a GitHub
# Release. The version name and code come from the tag (see appVersion() in app/build.gradle.kts).
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RECIPECRAFT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The RECIPECRAFT_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test, lint and build the signed release APK
        env:
          RECIPECRAFT_VERSION: ${{ github.ref_name }}
          RECIPECRAFT_KEYSTORE: ${{ runner.temp }}/release.jks
          RECIPECRAFT_KEYSTORE_PASSWORD: ${{ secrets.RECIPECRAFT_KEYSTORE_PASSWORD }}
          RECIPECRAFT_KEY_ALIAS: ${{ secrets.RECIPECRAFT_KEY_ALIAS }}
          RECIPECRAFT_KEY_PASSWORD: ${{ secrets.RECIPECRAFT_KEY_PASSWORD }}
        run: ./gradlew test lint koverVerify assembleRelease

      # app-release.apk only exists when the build was signed; an unsigned build is named
      # app-release-unsigned.apk, so this step also fails when signing was skipped.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="RecipeCraft-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$TAG" "$apk" --title "RecipeCraft $TAG" --generate-notes
